<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
      display: none;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <img id="top-image" alt="illustration" src="./assets/images/illustration-article.svg" />
    <div id="learning">
      <p id="learning-text">Learning</p>
    </div>

    <div id="published">
      <p id="published-text">Published 21 Dec 2023</p>
    </div>

    <div id="foundations">
      <h3 id="foundations-text">HTML & CSS foundations</h3>
    </div>

    <div id="summary">
      <p id="summary-text">These languages are the backbone of every website, defining structure, content, and presentation.</p>
    </div>

    <div id="author">
      <img id="avatar" alt="avatar" src="./assets/images/image-avatar.webp" />
      <p id="name">Greg Hooper</p>
    </div>

    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </div>
  <script src="index.js"></script>
</body>

</html>
